<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>单词视频 - 上下滑动播放</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-text-size-adjust: 100%;
      /* 禁止选中、长按菜单 */
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
    }

    /* 顶部搜索栏(固定) */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; gap: 8px; padding: 10px 12px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,0));
    }
    .topbar input {
      flex: 1; padding: 10px 14px; font-size: 16px;
      border: none; border-radius: 20px; background: rgba(255,255,255,.95);
      color: #333; min-width: 0;
    }
    .topbar button {
      padding: 0 18px; font-size: 15px; border: none; border-radius: 20px;
      background: #00a1d6; color: #fff; -webkit-appearance: none;
    }
    .topbar button:active { background: #0091c2; }

    /* 视频流容器:垂直滚动,每屏一个视频 */
    .feed {
      width: 100%; height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;   /* 关键:吸附到每个视频 */
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .feed::-webkit-scrollbar { display: none; }

    /* 单个视频卡片:占满一屏,snap 对齐 */
    .card {
      width: 100%; height: 100%;
      scroll-snap-align: start;
      scroll-snap-stop: always;        /* 一次滑动只过一屏,防连滑 */
      position: relative;
      background: #000;
      display: flex; align-items: center; justify-content: center;
    }
    video {
      width: 100%; height: 100%;
      object-fit: contain;             /* 不裁切,留黑边保完整 */
      background: #000;
    }

    /* 视频信息层(底部,半透明) */
    .info {
      position: absolute; left: 0; right: 60px; bottom: 0;
      padding: 16px; padding-bottom: max(20px, env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(0,0,0,.7), rgba(0,0,0,0));
      color: #fff; pointer-events: none;
    }
    .info .word { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .info .title { font-size: 14px; line-height: 1.4; opacity: .9; }
    .info .meta { font-size: 12px; opacity: .7; margin-top: 4px; }

    /* 右侧操作栏(点赞样式占位,后续可扩展) */
    .side {
      position: absolute; right: 8px; bottom: 80px;
      display: flex; flex-direction: column; gap: 18px;
      color: #fff; font-size: 11px; text-align: center;
    }
    .side .ico {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(0,0,0,.3); display: flex; align-items: center; justify-content: center;
      font-size: 20px; margin: 0 auto 2px;
    }
    .side .num { opacity: .9; }

    /* 序号指示(右上角 3/10) */
    .idx {
      position: absolute; top: 60px; right: 12px;
      color: #fff; font-size: 12px; opacity: .7;
      background: rgba(0,0,0,.3); padding: 4px 10px; border-radius: 10px;
    }

    /* 状态提示(加载中/错误/空) */
    .status {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px; text-align: center; padding: 20px;
      background: #000;
    }
    .status.hide { display: none; }
    .status .spin {
      width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%; margin: 0 auto 12px;
      animation: sp 1s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- 顶部搜索栏 -->
  <div class="topbar">
    <input id="wordInput" value="apple" placeholder="输入单词" autocomplete="off">
    <button onclick="search()">搜索</button>
  </div>

  <!-- 状态层 -->
  <div class="status" id="status">
    <div>
      <div class="spin"></div>
      <div id="statusText">加载中...</div>
    </div>
  </div>

  <!-- 视频流 -->
  <div class="feed" id="feed"></div>

  <script>
    // ===== 配置:两个后端的地址 =====
    const SPAPRO = 'http://localhost:8000';        // 词典+搜索后端
    const VIDEOSERVER = 'http://localhost:3000';   // 视频流代理

    // ===== 状态 =====
    let videoList = [];     // 搜索结果 [{bvid,title,author,play,duration,pic}]
    let currentIdx = 0;     // 当前播放的视频索引
    let currentWord = '';   // 当前单词

    const $ = id => document.getElementById(id);

    // ===== 搜索单词视频 =====
    async function search() {
      const word = $('wordInput').value.trim();
      if (!word) return;
      currentWord = word;
      showStatus('搜索 "' + word + '" 的视频...');

      try {
        const r = await fetch(`${SPAPRO}/api/search-video?word=${encodeURIComponent(word)}`);
        const j = await r.json();
        if (!j.ok) throw new Error(j.error || '搜索失败');
        if (!j.list || !j.list.length) {
          showStatus('没找到 "' + word + '" 的教学视频');
          return;
        }
        videoList = j.list;
        currentIdx = 0;
        renderFeed();
        hideStatus();
      } catch (e) {
        showStatus('搜索失败: ' + e.message);
      }
    }

    // ===== 渲染视频流 =====
    function renderFeed() {
      const feed = $('feed');
      feed.innerHTML = '';
      videoList.forEach((v, i) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <video data-idx="${i}" playsinline webkit-playsinline="true"
                 preload="none" loop
                 poster="${v.pic ? 'https:' + v.pic : ''}"></video>
          <div class="idx">${i + 1}/${videoList.length}</div>
          <div class="info">
            <div class="word">${esc(currentWord)}</div>
            <div class="title">${esc(v.title)}</div>
            <div class="meta">@${esc(v.author)} · 播放 ${fmtPlay(v.play)} · ${v.duration}</div>
          </div>
          <div class="side">
            <div><div class="ico">▶</div><div class="num">${v.duration}</div></div>
          </div>
        `;
        feed.appendChild(card);
      });

      // 设置每个 video 的 src(延迟加载:只设当前和相邻的)
      loadVideoSrc(0);

      // 监听滚动,切换播放
      feed.onscroll = onScroll;
      // 首屏立即播
      setTimeout(() => playIdx(0), 100);
    }

    // ===== 延迟加载:只给当前视频设 src,减少流量 =====
    function loadVideoSrc(idx) {
      const v = $('feed').children[idx];
      if (!v) return;
      const video = v.querySelector('video');
      if (!video.src) {
        video.src = `${VIDEOSERVER}/api/stream?bvid=${videoList[idx].bvid}`;
      }
    }

    // ===== 播放指定索引,暂停其他 =====
    function playIdx(idx) {
      const cards = $('feed').children;
      for (let i = 0; i < cards.length; i++) {
        const video = cards[i].querySelector('video');
        if (i === idx) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      }
      currentIdx = idx;
      loadVideoSrc(idx);
    }

    // ===== 滚动监听:用 scroll snap 后,检测当前屏 =====
    let scrollTimer;
    function onScroll() {
      clearTimeout(scrollTimer);
      scrollTimer = setTimeout(() => {
        const feed = $('feed');
        const idx = Math.round(feed.scrollTop / feed.clientHeight);
        if (idx !== currentIdx) {
          playIdx(idx);
        }
      }, 100);
    }

    // ===== 辅助 =====
    function showStatus(t) { $('statusText').textContent = t; $('status').classList.remove('hide'); }
    function hideStatus() { $('status').classList.add('hide'); }
    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function fmtPlay(n) { return n >= 10000 ? (n/10000).toFixed(1) + '万' : n; }

    // ===== 启动 =====
    search();
  </script>
</body>
</html>
