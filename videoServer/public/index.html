<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 关键:手机端适配,宽度=设备宽度,初始缩放=1,禁止用户缩放避免双击放大 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>B站视频代理播放 Demo</title>
  <style>
    /* ========== 重置 + 基础 ========== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #333;
      /* 手机优先:小padding,大字,不设max-width让撑满 */
      padding: 12px 14px 40px;
      -webkit-text-size-adjust: 100%;
    }

    h1 { font-size: 18px; margin-bottom: 6px; }
    .tip { color: #888; font-size: 12px; line-height: 1.5; margin-bottom: 12px; }
    code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 12px; }

    /* ========== 输入行:手机上纵向堆叠 ========== */
    .row {
      display: flex;
      gap: 8px;
      margin: 12px 0;
      flex-wrap: wrap;
    }
    input {
      flex: 1 1 100%;              /* 手机上占满一行 */
      padding: 12px 10px;          /* 够大的点击区域 */
      font-size: 16px;             /* 16px 防 iOS 自动放大 */
      border: 1px solid #ccc;
      border-radius: 6px;
      min-width: 0;
    }
    .btns { display: flex; gap: 8px; flex: 1 1 100%; }
    button {
      flex: 1;
      padding: 12px 16px;          /* 够大的触摸区域 */
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background: #00a1d6;
      color: #fff;
      cursor: pointer;
      -webkit-appearance: none;    /* 去掉 iOS 默认样式 */
    }
    button:active { background: #0091c2; }   /* 手机用 active 反馈 */
    button.ghost { background: #f0f0f0; color: #333; }

    /* ========== 视频容器:响应式 + 横竖屏自适应 ========== */
    .video-wrap {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 8px;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;            /* 手机上别把整个屏幕都占满 */
      /*
        object-fit: contain —— 横屏视频在竖屏手机上自然留上下黑边,不裁切
        这样字幕、人脸不会被切掉。黑边是正常且必要的。
      */
      object-fit: contain;
    }
    /* 横屏(手机转横):让视频更大,占满高度 */
    @media (orientation: landscape) and (max-height: 500px) {
      video { max-height: 90vh; }
    }

    /* ========== 调试输出 ========== */
    h3 { font-size: 14px; margin: 20px 0 8px; }
    pre {
      background: #f5f5f5;
      padding: 10px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 12px;
      max-height: 200px;
      overflow: auto;
      line-height: 1.5;
    }
    .ok { color: #52c41a; } .err { color: #f5222d; }

    /* ========== 大屏(平板/桌面):限制宽度居中 ========== */
    @media (min-width: 768px) {
      body { max-width: 720px; margin: 0 auto; padding: 24px 20px 40px; }
      h1 { font-size: 22px; }
      input { flex: 1 1 auto; }
      .btns { flex: 0 0 auto; }
      button { flex: 0 0 auto; padding: 10px 20px; }
    }
  </style>
</head>
<body>
  <h1>B站视频代理播放 Demo</h1>
  <div class="tip">前端只用 <code>&lt;video src="/api/stream?bvid=xxx"&gt;</code>,后端代理解决 CORS、防盗链、直链过期。播完无 B站推荐墙。</div>

  <div class="row">
    <input id="bvid" value="BV1LhcZz3En4" placeholder="输入 BV 号,如 BV1LhcZz3En4" autocomplete="off">
    <div class="btns">
      <button onclick="play()">播放</button>
      <button class="ghost" onclick="resolve()">解析</button>
    </div>
  </div>

  <div class="video-wrap">
    <video id="v" controls playsinline webkit-playsinline="true" preload="metadata"></video>
  </div>

  <h3>解析结果</h3>
  <pre id="out">点击"解析"看后端拿到了什么</pre>

  <script>
    const $ = id => document.getElementById(id);

    function play() {
      const bvid = $('bvid').value.trim();
      $('v').src = '/api/stream?bvid=' + encodeURIComponent(bvid);
      $('v').load();
      $('v').play().catch(() => {});
      $('out').textContent = '已设置 src: /api/stream?bvid=' + bvid;
    }

    async function resolve() {
      const bvid = $('bvid').value.trim();
      $('out').textContent = '解析中...';
      try {
        const r = await fetch('/api/resolve?bvid=' + encodeURIComponent(bvid));
        const j = await r.json();
        $('out').innerHTML = '<span class="' + (j.ok ? 'ok' : 'err') + '">' + (j.ok ? '✅ ' : '❌ ') + '</span>'
          + JSON.stringify(j, null, 2);
      } catch (e) {
        $('out').textContent = '请求失败: ' + e.message;
      }
    }

    play();
  </script>
</body>
</html>
