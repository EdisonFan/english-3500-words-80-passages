<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>单词翻译</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="dict-page-body">
<header class="dict-topbar">
    <button class="dict-back" id="dictBack" aria-label="返回">
        <span class="dict-back-arrow">‹</span>
    </button>
    <div class="dict-topbar-title" id="dictTopbarTitle">单词翻译</div>
</header>
<main class="dict-main" id="dictMain">
    <div class="dict-loading"><span class="dict-spinner"></span>加载中…</div>
</main>
<script>
/* === 单词翻译独立页面 ===
   数据源:
   1) sessionStorage.dictPayload(由 app.js 跳转时塞入,含 word + dictData) — 命中即直接渲染
   2) URL ?word=xxx — 兜底,直接访问该页时根据 word 调 /api/dict 拉取
*/
var mainEl = document.getElementById('dictMain');
var titleEl = document.getElementById('dictTopbarTitle');

// 返回箭头:有上一页则 history.back(),否则回首页
document.getElementById('dictBack').addEventListener('click', function () {
    if (history.length > 1) {
        history.back();
    } else {
        location.href = '/';
    }
});

function esc(text) {
    if (text === undefined || text === null) return '';
    return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function getWordFromUrl() {
    var params = new URLSearchParams(location.search);
    return (params.get('word') || '').toLowerCase().trim();
}

/* 播放发音音频 */
function playAudio(btn, src) {
    if (window.event) window.event.stopPropagation();
    try {
        var audio = new Audio(src);
        audio.play().catch(function () { });
        btn.classList.add('playing');
        setTimeout(function () { btn.classList.remove('playing'); }, 600);
    } catch (e) { }
}

/* 跳到单词对应的视频页(PC 新标签页 / 手机当前页) */
function isMobileDevice() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(navigator.userAgent);
}
function openVideoPage(word, list) {
    word = String(word || '').toLowerCase().trim();
    if (!word) return;
    try {
        sessionStorage.setItem('videoList', JSON.stringify(list || []));
        sessionStorage.setItem('videoWord', word);
    } catch (e) { }
    var url = '/video.html?word=' + encodeURIComponent(word);
    if (isMobileDevice()) {
        location.href = url;
    } else {
        window.open(url, '_blank');
    }
}

/* === 渲染 === */
function renderPage(data, videoList) {
    if (data && data.word) {
        titleEl.textContent = data.word;
        document.title = data.word + ' · 单词翻译';
    }

    var html = '<div class="dict-eyebrow">Dictionary</div>';

    // 视频按钮:有视频列表才显示
    var videoBtnHtml = '';
    if (data && data.word && videoList && videoList.length) {
        var videoWord = (data.prototype || data.word).toLowerCase();
        var listJson = JSON.stringify(videoList).replace(/'/g, '&#39;');
        videoBtnHtml = '<button class="dict-video-btn" data-videoword="' + esc(videoWord) + '" data-videolist="' + esc(listJson) + '"><span class="dv-icon">▶</span> 教学视频</button>';
    }

    if (data && data.loading) {
        html += '<div class="dict-word-row"><div class="dict-word">' + esc(data.word) + '</div>' + videoBtnHtml + '</div>';
        html += '<div class="dict-loading"><span class="dict-spinner"></span>查询中…</div>';
        mainEl.innerHTML = html;
        return;
    }

    if (data && data.error) {
        html += '<div class="dict-word-row"><div class="dict-word">' + esc(data.word || '') + '</div>' + videoBtnHtml + '</div>';
        html += '<div class="dict-empty">查询失败：' + esc(data.error) + '</div>';
        mainEl.innerHTML = html;
        bindVideoBtn();
        return;
    }

    if (!data || !data.found) {
        html += '<div class="dict-word-row"><div class="dict-word">' + esc((data && data.word) || '') + '</div>' + videoBtnHtml + '</div>';
        html += '<div class="dict-empty">未找到该词的释义</div>';
        mainEl.innerHTML = html;
        bindVideoBtn();
        return;
    }

    // 单词
    html += '<div class="dict-word-row"><div class="dict-word">' + esc(data.word) + '</div>' + videoBtnHtml + '</div>';

    // 基础形式提示
    if (data.base_form) {
        html += '<div class="dict-base-form">← ' + esc(data.base_form) + ' 的所有格/缩写形式</div>';
    }

    // 音标 + 发音按钮
    var phonRow = '<div class="dict-phon-row">';
    if (data.phonetic_uk || data.audio_uk) {
        phonRow += '<div class="phon-block">';
        if (data.phonetic_uk) phonRow += '<span class="phon-text">' + esc(data.phonetic_uk) + '</span>';
        if (data.audio_uk) phonRow += '<button class="audio-btn" onclick="playAudio(this, \'' + esc(data.audio_uk) + '\')"><span class="audio-icon">🔊</span>英</button>';
        phonRow += '</div>';
    }
    if (data.phonetic_us || data.audio_us) {
        phonRow += '<div class="phon-block">';
        if (data.phonetic_us) phonRow += '<span class="phon-text">' + esc(data.phonetic_us) + '</span>';
        if (data.audio_us) phonRow += '<button class="audio-btn" onclick="playAudio(this, \'' + esc(data.audio_us) + '\')"><span class="audio-icon">🔊</span>美</button>';
        phonRow += '</div>';
    }
    phonRow += '</div>';
    if (data.phonetic_uk || data.phonetic_us || data.audio_uk || data.audio_us) {
        html += phonRow;
    }

    // 原型词
    if (data.prototype) {
        html += '<div class="dict-prototype"><span class="prototype-label">原型</span><span class="prototype-value">' + esc(data.prototype) + '</span></div>';
    }

    // 考试类型
    if (data.exam_type && data.exam_type.length) {
        html += '<div class="dict-exam-type">';
        html += '<span class="exam-type-label">考试</span>';
        data.exam_type.forEach(function (t) {
            html += '<span class="exam-type-tag">' + esc(t) + '</span>';
        });
        html += '</div>';
    }

    // 中文释义
    if (data.defs && data.defs.length) {
        html += '<div class="dict-defs">';
        data.defs.forEach(function (d) {
            html += '<div class="dict-def">';
            if (d.pos) html += '<span class="pos">' + esc(d.pos) + '</span>';
            if (d.meaning) html += '<span class="meaning">' + esc(d.meaning) + '</span>';
            html += '</div>';
        });
        html += '</div>';
    }

    // 变形
    if (data.forms && data.forms.length) {
        html += '<div class="dict-section">';
        html += '<div class="dict-section-label">变形</div>';
        var formsText = data.forms.map(function (f) {
            return esc(f.name) + ': ' + esc(f.value);
        }).join('；');
        html += '<div class="dict-section-body">' + formsText + '</div>';
        html += '</div>';
    }

    // 双语例句
    if (data.examples && data.examples.length) {
        html += '<div class="dict-section">';
        html += '<div class="dict-section-label">双语例句</div>';
        data.examples.forEach(function (ex) {
            html += '<div class="dict-example">';
            html += '<div class="example-en">' + esc(ex.en) + '</div>';
            html += '<div class="example-zh">' + esc(ex.zh) + '</div>';
            html += '</div>';
        });
        html += '</div>';
    }

    // 同义词
    if (data.synonyms && data.synonyms.length) {
        html += '<div class="dict-section">';
        html += '<div class="dict-section-label">同义词</div>';
        data.synonyms.forEach(function (syn) {
            html += '<div class="dict-syn-item">';
            if (syn.pos) html += '<span class="syn-pos">' + esc(syn.pos) + '</span>';
            if (syn.meaning) html += '<span class="syn-meaning">' + esc(syn.meaning) + '</span>';
            html += '<span class="syn-words">' + esc(syn.words.join(', ')) + '</span>';
            html += '</div>';
        });
        html += '</div>';
    }

    // 词组搭配
    if (data.phrs && data.phrs.length) {
        html += '<div class="dict-section">';
        html += '<div class="dict-section-label">词组搭配</div>';
        data.phrs.forEach(function (p) {
            html += '<div class="dict-phr-item">';
            html += '<span class="phr-phrase">' + esc(p.phrase) + '</span>';
            if (p.translations && p.translations.length) {
                html += '<span class="phr-trans">' + esc(p.translations.join('；')) + '</span>';
            }
            html += '</div>';
        });
        html += '</div>';
    }

    // 考试/个人化信息
    if (data.individual && Object.keys(data.individual).length) {
        var ind = data.individual;
        html += '<div class="dict-section">';
        html += '<div class="dict-section-label">考试信息</div>';

        var indMeta = [];
        if (ind.level) indMeta.push(esc(ind.level));
        if (ind.mnemonic) indMeta.push(esc(ind.mnemonic));
        if (indMeta.length) {
            html += '<div class="dict-ind-meta">' + indMeta.join(' · ') + '</div>';
        }

        if (ind.examInfo && (ind.examInfo.frequency || ind.examInfo.year)) {
            html += '<div class="dict-ind-exam-info">';
            if (ind.examInfo.frequency) html += '<span class="exam-stat">近' + esc(String(ind.examInfo.year || '')) + '年考频 <b>' + esc(String(ind.examInfo.frequency)) + '</b></span>';
            if (ind.examInfo.recommendationRate) html += '<span class="exam-stat">推荐指数 <b>' + esc(String(ind.examInfo.recommendationRate)) + '</b></span>';
            html += '</div>';
            if (ind.examInfo.questionTypeInfo && ind.examInfo.questionTypeInfo.length) {
                html += '<div class="dict-ind-qtypes">';
                ind.examInfo.questionTypeInfo.forEach(function (q) {
                    html += '<span class="qtype-tag">' + esc(q.type) + ' ' + esc(String(q.time || '')) + '</span>';
                });
                html += '</div>';
            }
        }

        if (ind.idiomatic && ind.idiomatic.length) {
            ind.idiomatic.forEach(function (c) {
                html += '<div class="dict-idiom-item">';
                html += '<span class="idiom-en">' + esc(c.en) + '</span>';
                html += '<span class="idiom-zh">' + esc(c.zh) + '</span>';
                html += '</div>';
            });
        }

        if (ind.pastExamSents && ind.pastExamSents.length) {
            html += '<div class="dict-ind-past-sents">';
            html += '<div class="dict-section-sub-label">真题例句</div>';
            ind.pastExamSents.forEach(function (s) {
                html += '<div class="dict-past-sent-item">';
                html += '<div class="past-sent-en">' + esc(s.en) + '</div>';
                html += '<div class="past-sent-zh">' + esc(s.zh) + '</div>';
                if (s.source) html += '<div class="past-sent-src">' + esc(s.source) + '</div>';
                html += '</div>';
            });
            html += '</div>';
        }
        html += '</div>';
    }

    // 数据源
    if (data.sources && data.sources.length) {
        var sourceLabels = { 'youdao': '有道词典' };
        var labels = data.sources.map(function (s) { return sourceLabels[s] || s; });
        html += '<div class="dict-source">数据来源：' + esc(labels.join(' + ')) + '</div>';
    }

    mainEl.innerHTML = html;
    insertVideoBtn(data, videoList);
    wrapEnglishWords();
}

/* 创建/更新"教学视频"按钮(幂等:已存在则只刷新 data-videolist) */
function insertVideoBtn(data, videoList) {
    var row = mainEl.querySelector('.dict-word-row');
    if (!row || !data || !data.word) return;
    var existing = row.querySelector('.dict-video-btn');
    if (!videoList || !videoList.length) {
        // 没有视频,移除旧按钮
        if (existing) existing.remove();
        return;
    }
    var videoWord = (data.prototype || data.word).toLowerCase();
    var listJson = JSON.stringify(videoList).replace(/'/g, '&#39;');
    if (existing) {
        existing.setAttribute('data-videoword', videoWord);
        existing.setAttribute('data-videolist', listJson);
    } else {
        var btn = document.createElement('button');
        btn.className = 'dict-video-btn';
        btn.setAttribute('data-videoword', videoWord);
        btn.setAttribute('data-videolist', listJson);
        btn.innerHTML = '<span class="dv-icon">▶</span> 教学视频';
        btn.addEventListener('click', function () {
            var list = [];
            try { list = JSON.parse(btn.getAttribute('data-videolist') || '[]'); } catch (e) {}
            openVideoPage(btn.getAttribute('data-videoword') || '', list);
        });
        row.appendChild(btn);
    }
}

/* sessionStorage 路径专用:app.js 跳转时可能没传 videoList,这里补查一次
   查到了插入按钮,查不到就算了(走 URL 路径已在 init 里查过) */
function maybeFetchAndInsertVideo(data) {
    if (!data || !data.word) return;
    var row = mainEl.querySelector('.dict-word-row');
    if (row && row.querySelector('.dict-video-btn')) return; // 已有按钮
    var videoWord = (data.prototype || data.word).toLowerCase();
    fetch('/api/search-video?word=' + encodeURIComponent(videoWord))
        .then(function (r) { return r.json(); })
        .then(function (j) {
            if (j && j.ok && j.list && j.list.length) {
                insertVideoBtn(data, j.list);
            }
        })
        .catch(function () { /* 查不到就算了 */ });
}

/* === 翻译页内英文单词点击 === */
/* 把已知含英文的节点里的每个英文单词包成可点击 .dw
   (与 app.js 的 tokenizeAndWrap 一致,但只读纯文本、不处理 {word} 标记) */
var ENGLISH_TEXT_SELECTOR = [
    '.example-en',       // 双语例句 英文
    '.phr-phrase',       // 词组搭配 短语
    '.syn-words',        // 同义词 词列表
    '.idiom-en',         // 固定搭配 英文
    '.past-sent-en',     // 真题例句 英文
    '.prototype-value'   // 原型词
].join(',');

function wrapEnglishWords() {
    var nodes = mainEl.querySelectorAll(ENGLISH_TEXT_SELECTOR);
    for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        // 已经被包过(二次渲染)就跳过
        if (el.getAttribute('data-wrapped') === '1') continue;
        el.setAttribute('data-wrapped', '1');
        el.innerHTML = tokenizeEnglish(el.textContent || '');
    }
}

/* 把一段纯英文文本里的每个单词包成 <span class="dw" data-word="..."> */
function tokenizeEnglish(text) {
    if (!text) return '';
    var re = /([A-Za-z][A-Za-z''']*)/g;
    var html = '';
    var lastIdx = 0;
    var match;
    while ((match = re.exec(text)) !== null) {
        if (match.index > lastIdx) {
            html += esc(text.slice(lastIdx, match.index));
        }
        var word = match[1];
        var display = String(word).replace(/^[''']+|[''']+$/g, '');
        var query = display.replace(/['']/g, "'").toLowerCase();
        html += '<span class="dw" data-word="' + esc(query) + '">' + esc(display) + '</span>';
        lastIdx = re.lastIndex;
    }
    if (lastIdx < text.length) {
        html += esc(text.slice(lastIdx));
    }
    return html;
}

/* 翻译页内英文单词点击:跳转到自己(走 URL 兜底查接口) */
mainEl.addEventListener('click', function (e) {
    var target = e.target.closest('.dw');
    if (!target) return;
    e.stopPropagation();
    e.preventDefault();
    var word = target.getAttribute('data-word');
    if (!word) return;
    // 用 location.href 进入历史栈,方便用户逐词返回
    location.href = '/dict.html?word=' + encodeURIComponent(word);
});

/* === 启动 === */
(function init() {
    // 优先:sessionStorage 拿 app.js 传来的数据
    var payload = null;
    try {
        var raw = sessionStorage.getItem('dictPayload');
        if (raw) {
            payload = JSON.parse(raw);
            sessionStorage.removeItem('dictPayload');
        }
    } catch (e) {}

    if (payload && payload.word && payload.dictData) {
        renderPage(payload.dictData, payload.videoList || []);
        // app.js 跳转时可能没传 videoList(用户首次点这个词),补查一次
        if (!payload.videoList || !payload.videoList.length) {
            maybeFetchAndInsertVideo(payload.dictData);
        }
        return;
    }

    // 兜底:URL ?word=xxx
    var word = getWordFromUrl();
    if (!word) {
        renderPage({ word: '', error: '缺少单词参数' }, []);
        return;
    }
    renderPage({ word: word, loading: true }, []);
    fetch('/api/dict?q=' + encodeURIComponent(word))
        .then(function (r) { return r.json(); })
        .then(function (data) {
            // 顺手查视频(给"教学视频"按钮用)
            var videoWord = (data && data.prototype ? data.prototype : word).toLowerCase();
            fetch('/api/search-video?word=' + encodeURIComponent(videoWord))
                .then(function (r) { return r.json(); })
                .then(function (j) {
                    var list = (j && j.ok && j.list) ? j.list : [];
                    renderPage(data, list);
                })
                .catch(function () { renderPage(data, []); });
        })
        .catch(function (err) {
            renderPage({ word: word, error: String(err.message || err) }, []);
        });
})();
</script>
</body>
</html>
