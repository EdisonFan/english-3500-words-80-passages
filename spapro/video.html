<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>教学视频</title>
<link rel="stylesheet" href="style.css">
<!-- 西瓜播放器 xgplayer v3 (UMD, 全局变量 Player) -->
<link rel="stylesheet" href="https://unpkg.com/xgplayer/dist/index.min.css">
<script src="https://unpkg.com/xgplayer/dist/index.min.js"></script>
<style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
    .video-page { width: 100vw; height: 100vh; position: relative; }

    /* xgplayer 容器:撑满 card */
    .video-card .xg-box {
        width: 100%; height: 100%;
        background: #000;
    }
    /* xgplayer 内部 video 撑满、不裁切 */
    .video-card .xg-box video {
        width: 100% !important; height: 100% !important;
        object-fit: contain !important;
        background: #000;
    }

    /* 右上角圆形按钮组:横屏 + 下载 */
    .card-corner-btns {
        position: absolute; top: 16px; right: 16px;
        top: max(16px, env(safe-area-inset-top));
        display: flex; gap: 10px; z-index: 30;
    }
    .card-corner-btns button,
    .card-corner-btns a {
        width: 40px; height: 40px; border-radius: 50%;
        background: rgba(0,0,0,0.5); color: #fff;
        border: none; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; text-decoration: none;
        -webkit-tap-highlight-color: transparent;
    }
    .card-corner-btns button:active,
    .card-corner-btns a:active { background: rgba(255,255,255,0.25); }

    /* xgplayer 控件层在 z-index 10 左右,corner 按钮要在其上 */
    .video-card .xgplayer { z-index: 1; }
</style>
</head>
<body>
<div class="video-page">
    <div class="video-feed" id="videoFeed"></div>
</div>
<script>
/* 独立视频页:用西瓜播放器 xgplayer 替代自写 video
   - 横屏:点击右上角横屏按钮 → 触发 xgplayer 全屏(rotateFullscreen 自动旋转横屏)
   - 下载:点击右上角下载按钮 → 走 /api/stream?bvid=xxx&download=1 (Content-Disposition 指定文件名)
   - 抖音式竖屏视频流保留:滚动停稳后切换播放,远处销毁实例释放内存 */
var VIDEO_SERVER = '';
var _videoList = [];
var _videoIdx = 0;
var _videoWord = '';
var videoFeed = document.getElementById('videoFeed');
// 每个卡片的 xgplayer 实例:idx -> Player
var _players = {};

function getWordFromUrl() {
    var params = new URLSearchParams(location.search);
    return (params.get('word') || '').toLowerCase().trim();
}
function esc(text) {
    if (!text) return '';
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function fmtPlayCount(n) {
    n = Number(n) || 0;
    return n >= 10000 ? (n / 10000).toFixed(1) + '万' : n;
}

// 渲染视频流:每屏一个 card,内含 xgplayer 容器 + 右上角按钮组
function renderVideoFeed() {
    var html = '';
    _videoList.forEach(function(v, i) {
        var dlHref = VIDEO_SERVER + '/api/stream?bvid=' + encodeURIComponent(v.bvid) + '&download=1';
        html += '<div class="video-card" data-idx="' + i + '">';
        html += '<div class="xg-box" id="xg-' + i + '"></div>';
        // 右上角按钮:横屏(全屏旋转) + 下载
        html += '<div class="card-corner-btns">';
        html += '<button class="card-landscape-btn" title="横屏播放" data-landscape-idx="' + i + '">&#x2B6E;</button>';
        html += '<a class="card-download-btn" title="下载视频" href="' + dlHref + '" download="' + esc(v.bvid) + '.mp4" target="_blank" rel="noopener">&#x2B07;</a>';
        html += '</div>';
        html += '<div class="video-card-idx">' + (i + 1) + '/' + _videoList.length + '</div>';
        html += '<div class="video-card-info">';
        html += '<div class="video-card-word">' + esc(_videoWord) + '</div>';
        html += '<div class="video-card-title">' + esc(v.title) + '</div>';
        html += '<div class="video-card-meta">@' + esc(v.author) + ' · 播放 ' + fmtPlayCount(v.play) + ' · ' + esc(v.duration) + '</div>';
        html += '</div>';
        html += '</div>';
    });
    videoFeed.innerHTML = html;

    // 横屏按钮:触发对应 card 的 xgplayer 全屏(rotateFullscreen 自动横屏)
    videoFeed.addEventListener('click', function(e) {
        var btn = e.target.closest('.card-landscape-btn');
        if (!btn) return;
        e.stopPropagation();
        e.preventDefault();
        var idx = parseInt(btn.getAttribute('data-landscape-idx'), 10);
        var p = _players[idx];
        if (!p) return;
        // 优先调用全屏 API;失败则点击 xgplayer 自带全屏按钮
        try {
            if (typeof p.getFullscreen === 'function') {
                p.getFullscreen();
            } else if (typeof p.exitFullscreen === 'function') {
                p.fullscreen && p.fullscreen.getFullscreen && p.fullscreen.getFullscreen();
            } else {
                var fsBtn = videoFeed.children[idx].querySelector('.xgplayer-icon-fullscreen');
                if (fsBtn) fsBtn.click();
            }
        } catch (err) {
            var fsBtn2 = videoFeed.children[idx].querySelector('.xgplayer-icon-fullscreen');
            if (fsBtn2) fsBtn2.click();
        }
    });

    // 滚动监听(节流):停稳后切换播放
    var scrollTimer;
    videoFeed.onscroll = function() {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function() {
            var idx = Math.round(videoFeed.scrollTop / videoFeed.clientHeight);
            if (idx !== _videoIdx) playVideoIdx(idx);
        }, 120);
    };
}

// 创建一个 xgplayer 实例
function createPlayer(idx) {
    var v = _videoList[idx];
    if (!v || typeof window.Player === 'undefined') return null;
    var streamUrl = VIDEO_SERVER + '/api/stream?bvid=' + encodeURIComponent(v.bvid);
    var poster = v.pic ? ('https:' + v.pic) : '';
    try {
        var p = new window.Player({
            id: 'xg-' + idx,
            url: streamUrl,
            poster: poster,
            playsinline: true,
            loop: true,
            autoplay: false,
            volume: 0.6,
            lang: 'zh-cn',
            fluid: false,
            width: '100%',
            height: '100%',
            // 旋转控件(控制栏里) + 全屏时旋转横屏
            rotate: true,
            fullscreen: { rotateFullscreen: true },
            // 移动端适配
            'x5-video-player-type': 'h5',
            'x5-video-orientation': 'portraint',
        });
        return p;
    } catch (e) {
        console.error('[xgplayer] create failed idx=' + idx, e);
        return null;
    }
}

// 销毁实例释放内存
function destroyPlayer(idx) {
    var p = _players[idx];
    if (!p) return;
    try { p.destroy(); } catch (e) {}
    delete _players[idx];
}

// 切换播放:当前实例化并播放,预加载下一个,远处的销毁
function playVideoIdx(idx) {
    var cards = videoFeed.children;
    for (var i = 0; i < cards.length; i++) {
        if (i === idx) {
            // 当前:确保有实例,播放
            if (!_players[i]) _players[i] = createPlayer(i);
            var p = _players[i];
            if (p) {
                try { p.play(); } catch (e) {}
            }
        } else if (i === idx + 1) {
            // 预加载下一个:创建实例但不播放
            if (!_players[i]) _players[i] = createPlayer(i);
            var pn = _players[i];
            if (pn) { try { pn.pause(); } catch (e) {} }
        } else if (i === idx - 1) {
            // 上一个:暂停保留
            var pp = _players[i];
            if (pp) { try { pp.pause(); } catch (e) {} }
        } else {
            // 远处:销毁释放
            destroyPlayer(i);
        }
    }
    _videoIdx = idx;
}

// 启动:优先从 sessionStorage 取本页查好的视频列表
_videoWord = getWordFromUrl();
var cachedList = null;
var cachedWord = '';
try {
    cachedList = JSON.parse(sessionStorage.getItem('videoList') || 'null');
    cachedWord = sessionStorage.getItem('videoWord') || '';
} catch (e) {}

if (cachedList && cachedList.length && cachedWord === _videoWord) {
    _videoList = cachedList;
    renderVideoFeed();
    videoFeed.scrollTop = 0;
    setTimeout(function() { playVideoIdx(0); }, 100);
} else if (!_videoWord) {
    videoFeed.innerHTML = '<div class="video-loading"><div>缺少单词参数</div></div>';
} else {
    videoFeed.innerHTML = '<div class="video-loading"><div class="video-spin"></div><div>搜索 "' + esc(_videoWord) + '" 的教学视频…</div></div>';
    fetch(VIDEO_SERVER + '/api/search-video?word=' + encodeURIComponent(_videoWord))
        .then(function(r) { return r.json(); })
        .then(function(j) {
            if (!j.ok) throw new Error(j.error || '搜索失败');
            if (!j.list || !j.list.length) {
                videoFeed.innerHTML = '<div class="video-loading"><div>没找到 "' + esc(_videoWord) + '" 的教学视频</div></div>';
                return;
            }
            _videoList = j.list;
            renderVideoFeed();
            videoFeed.scrollTop = 0;
            setTimeout(function() { playVideoIdx(0); }, 100);
        })
        .catch(function(err) {
            videoFeed.innerHTML = '<div class="video-loading"><div>搜索失败: ' + esc(String(err.message || err)) + '</div></div>';
        });
}
</script>
</body>
</html>
