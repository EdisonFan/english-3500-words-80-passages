<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>教学视频</title>
<link rel="stylesheet" href="style.css">
<style>
    /* 独立视频页:body 直接作为全屏容器 */
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
    .video-page { width: 100vw; height: 100vh; position: relative; }

    /* 横屏切换按钮:始终显示 */
    .landscape-btn {
        position: absolute; top: 16px; right: 16px;
        width: 40px; height: 40px; border-radius: 50%;
        background: rgba(0,0,0,0.5); color: #fff;
        border: none; cursor: pointer;
        display: flex;
        align-items: center; justify-content: center;
        font-size: 18px; z-index: 30;
        -webkit-tap-highlight-color: transparent;
    }
    .landscape-btn:active { background: rgba(255,255,255,0.25); }

    /* 横屏模式:旋转整个 video-card,video 撑满,隐藏其他 UI */
    .video-card.landscape {
        /* 旋转后宽高互换:card 宽度=屏高,高度=屏宽,定位到屏幕中心 */
        width: 100vh; height: 100vw;
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center center;
        z-index: 20;
    }
    .video-card.landscape video {
        width: 100%; height: 100%;
        object-fit: contain;
        position: static; /* 覆盖 style.css 里可能的绝对定位 */
    }
    /* 横屏时隐藏序号、标题等信息,避免错位 */
    .video-card.landscape .video-card-idx,
    .video-card.landscape .video-card-info {
        display: none;
    }
    /* 横屏按钮反向旋转,保持按钮自身正立可点 */
    .video-card.landscape .landscape-btn {
        transform: rotate(-90deg);
        z-index: 31;
    }
</style>
</head>
<body>
<div class="video-page">
    <div class="video-feed" id="videoFeed"></div>
</div>
<script>
/* 独立视频页:从 sessionStorage 取本页查好的视频列表,直接渲染抖音式视频流 */
var VIDEO_SERVER = '';
var _videoList = [];
var _videoIdx = 0;
var _videoWord = '';
var videoFeed = document.getElementById('videoFeed');

// 从 URL 取 word 参数(仅作标识,实际数据从 sessionStorage 取)
function getWordFromUrl() {
    var params = new URLSearchParams(location.search);
    return (params.get('word') || '').toLowerCase().trim();
}

// HTML 转义
function esc(text) {
    if (!text) return '';
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function fmtPlayCount(n) {
    n = Number(n) || 0;
    return n >= 10000 ? (n / 10000).toFixed(1) + '万' : n;
}

// 渲染视频流:每屏一个视频
function renderVideoFeed() {
    var html = '';
    _videoList.forEach(function(v, i) {
        html += '<div class="video-card" data-idx="' + i + '">';
        html += '<button class="landscape-btn" title="横屏播放" data-landscape-idx="' + i + '">&#x2B6E;</button>';
        html += '<video playsinline webkit-playsinline="true" preload="auto" loop controls controlslist="nodownload noplaybackrate noremoteplayback"';
        if (v.pic) html += ' poster="https:' + v.pic + '"';
        html += '></video>';
        html += '<div class="video-card-idx">' + (i + 1) + '/' + _videoList.length + '</div>';
        html += '<div class="video-card-info">';
        html += '<div class="video-card-word">' + esc(_videoWord) + '</div>';
        html += '<div class="video-card-title">' + esc(v.title) + '</div>';
        html += '<div class="video-card-meta">@' + esc(v.author) + ' · 播放 ' + fmtPlayCount(v.play) + ' · ' + esc(v.duration) + '</div>';
        html += '</div>';
        html += '</div>';
    });
    videoFeed.innerHTML = html;

    // 横屏按钮点击:切换当前 card 的 landscape 类
    videoFeed.addEventListener('click', function(e) {
        var btn = e.target.closest('.landscape-btn');
        if (!btn) return;
        e.stopPropagation();
        var idx = parseInt(btn.getAttribute('data-landscape-idx'), 10);
        var card = videoFeed.children[idx];
        if (!card) return;
        card.classList.toggle('landscape');
    });

    // 滚动监听(节流):停稳后切换播放
    var scrollTimer;
    videoFeed.onscroll = function() {
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function() {
            var idx = Math.round(videoFeed.scrollTop / videoFeed.clientHeight);
            if (idx !== _videoIdx) playVideoIdx(idx);
        }, 120);
    };
}

// 拉取视频宽高信息,横屏视频才显示「横屏切换」按钮
var _videoInfoCache = {};
function fetchVideoInfo(idx) {
    var v = _videoList[idx];
    if (!v) return;
    var bvid = v.bvid;
    if (_videoInfoCache[bvid] !== undefined) {
        applyVideoInfo(idx, _videoInfoCache[bvid]);
        return;
    }
    fetch(VIDEO_SERVER + '/api/video-info?bvid=' + encodeURIComponent(bvid))
        .then(function(r) { return r.json(); })
        .then(function(j) {
            var info = (j && j.ok) ? j : null;
            _videoInfoCache[bvid] = info;
            applyVideoInfo(idx, info);
        })
        .catch(function() {});
}

function applyVideoInfo(idx, info) {
    // 按钮始终显示,这里仅保留接口缓存逻辑,不再控制按钮显隐
    // 切到新视频时还原竖屏模式
    var card = videoFeed.children[idx];
    if (!card) return;
    card.classList.remove('landscape');
}

// 给当前视频设 src 并播放,预加载下一个,清理远处的释放带宽
function playVideoIdx(idx) {
    var cards = videoFeed.children;
    for (var i = 0; i < cards.length; i++) {
        var video = cards[i].querySelector('video');
        if (i === idx) {
            // 当前:设 src + 播放
            var srcUrl = VIDEO_SERVER + '/api/stream?bvid=' + _videoList[i].bvid;
            if (video.getAttribute('data-loaded') !== srcUrl) {
                video.src = srcUrl;
                video.setAttribute('data-loaded', srcUrl);
                video.load();
            }
            video.play().catch(function() {});
        } else if (i === idx + 1) {
            // 预加载下一个:设 src + load,不 play
            var nextUrl = VIDEO_SERVER + '/api/stream?bvid=' + _videoList[i].bvid;
            if (video.getAttribute('data-loaded') !== nextUrl) {
                video.src = nextUrl;
                video.setAttribute('data-loaded', nextUrl);
                video.load();
            }
            video.pause();
        } else if (i === idx - 1) {
            // 上一个:保留 src 但暂停
            video.pause();
        } else {
            // 远处:清 src 释放带宽
            video.pause();
            if (video.src) {
                video.removeAttribute('src');
                video.removeAttribute('data-loaded');
                video.load();
            }
        }
    }
    _videoIdx = idx;
    // 拉当前视频的宽高信息,横屏视频才显示「横屏切换」按钮
    fetchVideoInfo(idx);
}

// 启动:优先从 sessionStorage 取本页查好的视频列表
_videoWord = getWordFromUrl();
var cachedList = null;
var cachedWord = '';
try {
    cachedList = JSON.parse(sessionStorage.getItem('videoList') || 'null');
    cachedWord = sessionStorage.getItem('videoWord') || '';
} catch (e) {}

if (cachedList && cachedList.length && cachedWord === _videoWord) {
    // 命中缓存:直接渲染,不再调搜索接口
    _videoList = cachedList;
    renderVideoFeed();
    videoFeed.scrollTop = 0;
    setTimeout(function() { playVideoIdx(0); }, 100);
} else if (!_videoWord) {
    videoFeed.innerHTML = '<div class="video-loading"><div>缺少单词参数</div></div>';
} else {
    // 兜底:sessionStorage 没数据(如直接访问 video.html),才调搜索接口
    videoFeed.innerHTML = '<div class="video-loading"><div class="video-spin"></div><div>搜索 "' + esc(_videoWord) + '" 的教学视频…</div></div>';
    fetch(VIDEO_SERVER + '/api/search-video?word=' + encodeURIComponent(_videoWord))
        .then(function(r) { return r.json(); })
        .then(function(j) {
            if (!j.ok) throw new Error(j.error || '搜索失败');
            if (!j.list || !j.list.length) {
                videoFeed.innerHTML = '<div class="video-loading"><div>没找到 "' + esc(_videoWord) + '" 的教学视频</div></div>';
                return;
            }
            _videoList = j.list;
            renderVideoFeed();
            videoFeed.scrollTop = 0;
            setTimeout(function() { playVideoIdx(0); }, 100);
        })
        .catch(function(err) {
            videoFeed.innerHTML = '<div class="video-loading"><div>搜索失败: ' + esc(String(err.message || err)) + '</div></div>';
        });
}
</script>
</body>
</html>
