<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考英语 3500 词 · 80 篇精读</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div class="modal-bg" id="modalBg">
    <div class="modal" id="modal">
        <button class="modal-close" id="modalClose">✕</button>
        <div id="modalContent"></div>
    </div>
</div>
<!-- 全屏视频层:点"视频"按钮后弹出,抖音式上下滑动播放 -->
<div class="video-stage" id="videoStage">
    <button class="video-stage-close" id="videoStageClose">✕</button>
    <div class="video-feed" id="videoFeed"></div>
    <!-- 调试浮层:显示前端日志,排查用 -->
    <div id="debugBox" style="position:fixed;left:8px;bottom:8px;width:90%;max-width:500px;max-height:40%;overflow-y:auto;background:rgba(0,0,0,.8);color:#0f0;font-size:11px;font-family:monospace;padding:8px;border-radius:6px;z-index:10002;pointer-events:auto;"></div>
</div>
<script src="app.js"></script>
</body>
</html>
