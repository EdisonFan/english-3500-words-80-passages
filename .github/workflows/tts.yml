name: Generate TTS audio (Microsoft Edge)

# Manual only by default: synthesising 80 passages is a few minutes of runner
# time, so it should not fire on every push. Add a `push:` trigger if you want it.
on:
  workflow_dispatch:
    inputs:
      rate:
        description: 'Speech rate (negative = slower). -20% suits intensive reading.'
        required: false
        default: '-20%'
      voice:
        description: 'Edge neural voice'
        required: false
        default: 'en-US-AriaNeural'
      start:
        description: 'First passage number (1-80)'
        required: false
        default: '1'
      end:
        description: 'Last passage number (1-80)'
        required: false
        default: '80'
      workers:
        description: 'Concurrent synth requests (<=3 recommended)'
        required: false
        default: '3'

permissions:
  contents: write          # needed by the Release step below

concurrency:
  group: tts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synth:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install edge-tts
        run: pip install edge-tts==7.3.1

      - name: Synthesise passages
        id: tts
        shell: bash
        run: |
          python scripts/gen_tts.py \
            --rate="${{ inputs.rate || '-20%' }}" \
            --voice "${{ inputs.voice || 'en-US-AriaNeural' }}" \
            --start "${{ inputs.start || '1' }}" \
            --end   "${{ inputs.end || '80' }}" \
            --workers "${{ inputs.workers || '3' }}" \
            --out audio
          echo "--- manifest ---"
          python - <<'PY'
          import json, os
          m = json.load(open('audio/manifest.json'))
          lines = [
              f"Voice: {m['voice']} | Rate: {m['rate']} | Words: {m['total_words']}",
              f"Synthesised: {m['ok']} | Skipped: {m['skipped']} | Failed: {m['failed']}",
              f"Audio size: {m['total_bytes']/1024/1024:.1f} MiB | Elapsed: {m['elapsed_sec']}s",
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## TTS result\n\n' + '\n\n'.join(lines) + '\n')
          print('\n'.join(lines))
          PY

      - name: Upload audio artifact
        if: always()          # keep whatever succeeded even if some passages failed
        uses: actions/upload-artifact@v4
        with:
          name: tts-audio
          path: audio/
          retention-days: 30
          if-no-files-found: warn

      # Long-lived copy: artifacts expire after 30 days, releases do not.
      - name: Attach audio to a release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tts-${{ github.run_number }}
          name: TTS audio run #${{ github.run_number }}
          body: |
            Slow-speed Microsoft Edge TTS for the 80 reading passages.
            Voice / rate / counts: see `manifest.json` in this release.
          files: |
            audio/*.mp3
            audio/manifest.json

      # Release/artifact binary hosts are blocked in some sandboxes, while
      # codeload.github.com (ordinary repo archives) is reachable. Publish the
      # mp3s as tracked files on a dedicated branch so they can be fetched as a
      # branch ZIP. Force-pushed so every run replaces the previous audio set.
      - name: Publish audio to tts-audio branch
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tts-audio
          git rm -rf --cached . --quiet || true   # --orphan keeps the old index otherwise
          cp audio/*.mp3 audio/manifest.json .
          git add -- *.mp3 manifest.json
          git commit -m "TTS audio run #${{ github.run_number }} (voice and rate in manifest.json)"
          git push -f origin tts-audio
